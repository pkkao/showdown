{% extends "base.html" %}

{% block content %}

<table id="data" class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Event</th>
      <th>Artist</th>
      <th>Title</th>
      <th>Link</th>
      <th>Nominated by</th>
    </tr>
  </thead>
  <tbody class="table-group-divider">
    {% for song in songs %}
      <tr>
        <td>{{ song.event.name }}</td>
        <td>{{ song.artist }}</td>
        <td>{{ song.title }}</td>
        <td><a href="{{ song.link }}">Link</a></td>
        <td>{{ song.user.username }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
<br>

{% endblock %}

{% block scripts %}
<script>
  $(document).ready(function () {
    $('#data').DataTable();
  });
</script>
{% endblock %}
